[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoleaklens"
version = "0.0.1"
description = "Causal redaction of location-leaking visual evidence (GeoLeakLens)."
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "pillow>=10",
  "omegaconf>=2.3",
  "tqdm>=4.66",
  "pydantic>=2.5",
  "modal>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]
ml = [
  "torch>=2.1",
  "torchvision>=0.16",
  "transformers>=4.40",
  "geoclip",
  "open_clip_torch",
  "sentence-transformers",
]
seg = [
  "opencv-python>=4.9",
  "segment-anything",
  "easyocr",
  "ultralytics",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
